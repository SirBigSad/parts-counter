# Builds Parts Counter into a Windows program (PartsCounter.exe).
# Put this file at .github/workflows/build-exe.yml in the same repository as the APK build.
# It uses the same parts-counter.html at the top of the repository. Every time you change it,
# GitHub builds a new .exe and posts it under "Releases".
name: Build Windows EXE
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the game, then build parts-counter.html from src/
        run: |
          node tests/saves.js
          node tests/bot.js
          node build.js
      - name: Create the desktop app
        shell: bash
        run: |
          set -e
          SRC=parts-counter.html; [ -f "$SRC" ] || SRC=index.html
          [ -f "$SRC" ] || { echo "Upload parts-counter.html to the top of the repository first."; exit 1; }
          mkdir -p desktop/build && cp "$SRC" desktop/index.html
          [ -f icon.png ] && cp icon.png desktop/build/icon.png
          cd desktop
          cat > package.json <<'EOF2'
          {
            "name": "parts-counter",
            "productName": "Parts Counter",
            "version": "1.0.0",
            "description": "Parts Counter idle game",
            "main": "main.js",
            "author": "Parts Counter",
            "build": {
              "appId": "com.fremonttruck.partscounter",
              "productName": "Parts Counter",
              "files": ["main.js", "index.html"],
              "win": { "target": "portable" },
              "icon": "build/icon.png",
              "portable": { "artifactName": "PartsCounter.exe" },
              "directories": { "output": "dist" }
            }
          }
          EOF2
          cat > main.js <<'EOF2'
          const { app, BrowserWindow, shell, screen } = require('electron');
          const path = require('path'), fs = require('fs');
          // keep the save in the same place every time, even though the portable exe unpacks to a temp folder
          app.setPath('userData', path.join(app.getPath('appData'), 'PartsCounter'));
          // remember the window's size, position and maximized state between runs
          const stateFile = () => path.join(app.getPath('userData'), 'window.json');
          function readState() {
            try {
              const s = JSON.parse(fs.readFileSync(stateFile(), 'utf8'));
              // only reuse the spot if it is still on a connected screen
              const onScreen = screen.getAllDisplays().some(d => { const a = d.workArea; return s.x >= a.x - 50 && s.y >= a.y - 50 && s.x < a.x + a.width - 100 && s.y < a.y + a.height - 100; });
              return onScreen ? s : { width: s.width, height: s.height, max: s.max };
            } catch (e) {
              // first run: most of the screen, so the computer layout has room
              const a = screen.getPrimaryDisplay().workArea;
              return { width: Math.min(1600, Math.round(a.width * 0.9)), height: Math.min(1000, Math.round(a.height * 0.9)), max: a.width < 1400 };
            }
          }
          function open() {
            const s = readState();
            const win = new BrowserWindow({
              x: s.x, y: s.y, width: s.width || 1280, height: s.height || 900, minWidth: 380, minHeight: 600,
              backgroundColor: '#101215', autoHideMenuBar: true, title: 'Parts Counter',
              webPreferences: { contextIsolation: true, backgroundThrottling: false }
            });
            if (s.max) win.maximize();
            win.setMenu(null);
            win.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: 'deny' }; });
            // F11 toggles full screen; Escape leaves it
            win.webContents.on('before-input-event', (e, input) => {
              if (input.type !== 'keyDown') return;
              if (input.key === 'F11') { win.setFullScreen(!win.isFullScreen()); e.preventDefault(); }
              else if (input.key === 'Escape' && win.isFullScreen()) win.setFullScreen(false);
            });
            const keep = () => { try { const b = win.getNormalBounds(); fs.mkdirSync(app.getPath('userData'), { recursive: true }); fs.writeFileSync(stateFile(), JSON.stringify({ x: b.x, y: b.y, width: b.width, height: b.height, max: win.isMaximized() })); } catch (e) {} };
            // save right before the window closes, so nothing is lost
            win.on('close', () => { keep(); win.webContents.executeJavaScript("typeof save==='function'&&save()").catch(() => {}); });
            win.loadFile('index.html');
          }
          app.whenReady().then(open);
          app.on('window-all-closed', () => app.quit());
          EOF2
          npm install --save-dev electron@31 electron-builder@24 --no-audit --no-fund
      - name: Build the EXE
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PartsCounter-exe
          path: desktop/dist/PartsCounter.exe
      - name: Post it under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-build-${{ github.run_number }}
          name: Parts Counter for Windows, build ${{ github.run_number }}
          body: Download PartsCounter.exe below and double-click it to play. Windows may warn that it's from an unknown publisher; choose More info, then Run anyway.
          files: desktop/dist/PartsCounter.exe
