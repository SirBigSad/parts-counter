# Builds Parts Counter into an Android app (APK).
# Put this file at .github/workflows/build.yml and parts-counter.html at the top of the repository.
# Every time you change either file, GitHub builds a new APK and posts it under "Releases".
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create the Android project
        run: |
          set -e
          SRC=parts-counter.html; [ -f "$SRC" ] || SRC=index.html
          [ -f "$SRC" ] || { echo "Upload parts-counter.html to the top of the repository first."; exit 1; }
          P=android/app/src/main
          mkdir -p $P/java/com/fremonttruck/partscounter $P/assets $P/res/mipmap-anydpi-v26 $P/res/drawable $P/res/values
          cp "$SRC" $P/assets/index.html
          # use icon.png from the repository as the app icon when it's there
          if [ -f icon.png ]; then
            mkdir -p $P/res/mipmap-xxxhdpi $P/res/mipmap-xxhdpi $P/res/mipmap-xhdpi
            python3 -c "from PIL import Image;im=Image.open('icon.png').convert('RGBA');[im.resize((s,s),Image.LANCZOS).save(p) for s,p in [(192,'$P/res/mipmap-xxxhdpi/ic_launcher.png'),(144,'$P/res/mipmap-xxhdpi/ic_launcher.png'),(96,'$P/res/mipmap-xhdpi/ic_launcher.png')]]" || { cp icon.png $P/res/mipmap-xxxhdpi/ic_launcher.png; }
            HAVE_ICON=1
          fi
          echo "" | base64 -d > android/app/release.p12
          cat > android/settings.gradle <<'EOF2'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'PartsCounter'
          include ':app'
          EOF2
          cat > android/build.gradle <<'EOF2'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF2
          cat > android/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx2g
          EOF2
          cat > android/app/build.gradle <<'EOF2'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.fremonttruck.partscounter'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.fremonttruck.partscounter'
                  minSdk 26
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'pkcs12'
                      storePassword 'partscounter'
                      keyAlias 'partscounter'
                      keyPassword 'partscounter'
                  }
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig signingConfigs.release }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF2
          cat > $P/AndroidManifest.xml <<'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="Parts Counter" android:icon="@mipmap/ic_launcher" android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2
          cat > $P/java/com/fremonttruck/partscounter/MainActivity.java <<'EOF2'
          package com.fremonttruck.partscounter;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return !r.getUrl().toString().startsWith("file:");
                      }
                  });
                  setContentView(web);
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  web.evaluateJavascript("typeof save==='function'&&save()", null);
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          }
          EOF2
          cat > $P/res/values/colors.xml <<'EOF2'
          <resources><color name="icon_bg">#C8371D</color></resources>
          EOF2
          if [ -z "$HAVE_ICON" ]; then
          cat > $P/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF2'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF2
          cat > $P/res/drawable/ic_fg.xml <<'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <group android:translateX="6" android:translateY="6" android:scaleX="0.5" android:scaleY="0.5">
                  <path android:pathData="M3,10l2,-6h14l2,6M4,10v10h16V10M9,20v-6h6v6" android:strokeColor="#FFFFFF"
                      android:strokeWidth="2" android:strokeLineJoin="round" android:fillColor="#00000000"/>
              </group>
          </vector>
          EOF2
          fi
      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PartsCounter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PartsCounter-apk
          path: PartsCounter.apk
      - name: Post it under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Parts Counter build ${{ github.run_number }}
          body: Tap PartsCounter.apk below to download it, then open it to install.
          files: PartsCounter.apk
